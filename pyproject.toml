[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-art-gen"
version = "0.2.0"
description = "Pixel-art editor for Minecraft mod asset creation"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-qt>=4.2",
]

[project.scripts]
minecraft-art-gen = "minecraft_art_gen.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=minecraft_art_gen --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
# GUI view-layer files are excluded; they require interactive/E2E testing
omit = [
    "src/minecraft_art_gen/main.py",
    "src/minecraft_art_gen/app.py",
    "src/minecraft_art_gen/screens/*",
    "src/minecraft_art_gen/editor/color_picker.py",
    "src/minecraft_art_gen/editor/canvas.py",
]
