[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "minecraft-art-gen"
version = "0.1.0"
description = "Pixel-art editor for Minecraft mod asset creation"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-qt>=4.2",
]

[project.scripts]
minecraft-art-gen = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# GUI view-layer files are excluded; they require interactive/E2E testing
omit = [
    "src/main.py",
    "src/app.py",
    "src/screens/*",
    "src/editor/color_picker.py",
]
